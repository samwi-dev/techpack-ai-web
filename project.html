<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Techpack Project</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#2c2c2b;background:#f0efed}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(520px,100%);background:#fff;border:1px solid #e6e5e3;border-radius:12px;padding:32px;box-shadow:0 4px 12px rgba(0,0,0,.04)}h1{font-size:22px;margin:0 0 8px}.status{color:#7d7a75;font-size:15px;line-height:1.6;margin:0}.error{color:#a33}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}</style></head><body><main class="shell" id="shell"><section class="panel"><h1>載入 Techpack 專案</h1><p class="status" id="status">正在讀取專案照片與資料…</p></section></main><iframe id="app" title="Techpack project"></iframe><script>(async()=>{const status=document.getElementById('status'),app=document.getElementById('app'),id=new URLSearchParams(location.search).get('project');if(!id||!/^[a-z0-9][a-z0-9-]{0,79}$/i.test(id)){status.textContent='請使用專案網址，例如：project.html?project=m2c-chalkbag-v1';status.className='status error';return}try{const[a,b]=await Promise.all([fetch(`./projects/${id}.json`,{cache:'no-store'}),fetch('./index.html',{cache:'no-store'})]);if(!a.ok)throw new Error('找不到專案資料包');if(!b.ok)throw new Error('無法讀取 Techpack 網站');const project=await a.json(),source=await b.text();if(project.schema!=='techpack-project-v1'||!Array.isArray(project.views))throw new Error('專案資料格式不正確');const doc=new DOMParser().parseFromString(source,'text/html'),dataEl=doc.querySelector('#techpack-data'),data=JSON.parse(dataEl.textContent),views=project.views.filter(v=>v&&typeof v.image==='string'&&v.image);if(!views.length)throw new Error('此專案尚未包含照片');while(data.pages.length<views.length)data.pages.push(JSON.parse(JSON.stringify(data.pages[data.pages.length-1])));data.pages=data.pages.slice(0,views.length);data.fields={...data.fields,...(project.fields||{})};views.forEach((view,i)=>{let h=data.pages[i].html,label=String(view.label||`VIEW ${i+1}`).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])),note=String(view.notes||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));h=h.replace(/(<div contenteditable="true" data-ph="VIEW LABEL" spellcheck="false">).*?(<\/div>)/,`$1${label}$2`);h=h.replace(/<div class="sketch-canvas-wrap" id="sketchWrap">[\s\S]*?<\/div><\/div>\n<\/div>\n<div class="notes-row">/,`<div class="sketch-canvas-wrap" id="sketchWrap"><img alt="${label}" src="${view.image}"><input accept="image/*" id="sketchFile" style="display:none" type="file"/></div></div></div><div class="notes-row">`);h=h.replace(/(<div class="notes-content" contenteditable="true" data-ph="Additional notes…" spellcheck="false">).*?(<\/div>)/,`$1${note}$2`);data.pages[i].html=h});dataEl.textContent=JSON.stringify(data);doc.title=`Techpack — ${project.name||id}`;app.srcdoc='<!doctype html>\n'+doc.documentElement.outerHTML;app.onload=()=>{document.getElementById('shell').style.display='none';app.style.display='block'}}catch(e){status.textContent=`無法載入：${e.message}`;status.className='status error'}})();</script></body></html>
